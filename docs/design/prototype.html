const { useState, useEffect, useRef, useCallback, useMemo } = React;

// --------- Audio ---------
function useAudio(){
  const ctxRef = useRef(null);
  const mutedRef = useRef(false);
  const [muted, setMuted] = useState(false);
  useEffect(()=>{ mutedRef.current = muted; }, [muted]);

  const ensure = useCallback(()=>{
    if(!ctxRef.current){
      try{ ctxRef.current = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    }
    if(ctxRef.current && ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  },[]);

  const tone = useCallback((freq, dur=0.06, type='square', vol=0.07, slide=0)=>{
    if(mutedRef.current) return;
    const ctx = ensure(); if(!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ctx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq+slide), ctx.currentTime+dur);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, ctx.currentTime+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur);
    o.connect(g).connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime+dur+0.02);
  },[ensure]);

  const sfx = useMemo(()=>({
    blip: ()=>tone(880, 0.04, 'square', 0.05),
    confirm: ()=>{ tone(660, 0.05, 'square', 0.06); setTimeout(()=>tone(990, 0.07, 'square', 0.06), 55); },
    back: ()=>{ tone(440, 0.05, 'square', 0.05); setTimeout(()=>tone(330, 0.07, 'square', 0.05), 50); },
    chime: ()=>{
      [523, 659, 784, 1046].forEach((f,i)=>setTimeout(()=>tone(f, 0.08, 'square', 0.05), i*55));
    },
    error: ()=>tone(180, 0.18, 'sawtooth', 0.06, -60),
    konami: ()=>{
      [523, 659, 784, 1046, 1318].forEach((f,i)=>setTimeout(()=>tone(f, 0.09, 'square', 0.06), i*70));
    },
  }),[tone]);

  return { sfx, muted, setMuted, ensure };
}

function PixelSprite({ data, palette, scale=4, className='' }){
  const w = data[0].length, h = data.length;
  return (
    <svg className={className} width={w*scale} height={h*scale} viewBox={`0 0 ${w} ${h}`} shapeRendering="crispEdges" style={{imageRendering:'pixelated'}}>
      {data.flatMap((row,y)=>row.split('').map((c,x)=>{
        const fill = palette[c]; if(!fill || fill==='transparent') return null;
        return <rect key={`${x}-${y}`} x={x} y={y} width="1" height="1" fill={fill} />;
      }))}
    </svg>
  );
}

// ------- Confetti easter egg -------
function Confetti({ palette }){
  const COLORS = ['#ff3da6','#ffd83d','#3df0ff','#3dff7a','#ff7d3d','#a23dff'];
  const pieces = useMemo(()=>Array.from({length:60}, (_,i)=>({
    left: Math.random()*100,
    delay: Math.random()*1.2,
    dur: 1.4 + Math.random()*1.4,
    color: COLORS[i % COLORS.length],
    size: 3 + Math.floor(Math.random()*3),
    drift: (Math.random()-.5)*40,
  })),[]);
  return (
    <div className="absolute inset-0 pointer-events-none" style={{zIndex:7, overflow:'hidden'}}>
      {pieces.map((p,i)=>(
        <span key={i} className="confetti" style={{
          left:`${p.left}%`, top:'-10px',
          width:p.size, height:p.size,
          background:p.color,
          animation:`fall ${p.dur}s linear ${p.delay}s forwards`,
          ['--drift']:`${p.drift}px`,
        }}/>
      ))}
      <style>{`
        @keyframes fall { to { transform: translate(var(--drift), 320px) rotate(360deg); opacity:.2; } }
      `}</style>
    </div>
  );
}

function App(){
  const { sfx, muted, setMuted, ensure } = useAudio();
  const [screen, setScreen] = useState('home');         // home | about | projects | resume | contact
  const [stack, setStack] = useState([]);                // back-stack
  const [cursor, setCursor] = useState(0);
  const [scrollMap, setScrollMap] = useState({about:0, projects:0, resume:0});
  const [pressed, setPressed] = useState({});            // visual press state
  const [konamiOn, setKonamiOn] = useState(false);
  const [confetti, setConfetti] = useState(false);
  const [secret, setSecret] = useState(false);
  const [orientation, setOrientation] = useState('portrait');
  const [downloadBlink, setDownloadBlink] = useState(false);
  const [bootTick, setBootTick] = useState(0); // for ambient subtle anim

  const konamiBuf = useRef([]);
  const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];

  // palette
  const PAL_NORMAL = {bg:'#bcd6a6', hi:'#dbe8c8', mid:'#4d6a3a', ink:'#1f2d18'};
  const PAL_KONAMI = {bg:'#0a0a1a', hi:'#ff3da6', mid:'#3df0ff', ink:'#fff7d6'};
  const palette = konamiOn ? PAL_KONAMI : PAL_NORMAL;

  // orientation watcher (mobile)
  useEffect(()=>{
    const check = ()=>{
      const w = window.innerWidth, h = window.innerHeight;
      const isMobile = w < 700;
      if(isMobile && w > h) setOrientation('landscape');
      else setOrientation('portrait');
    };
    check();
    window.addEventListener('resize', check);
    window.addEventListener('orientationchange', check);
    return ()=>{ window.removeEventListener('resize', check); window.removeEventListener('orientationchange', check); };
  },[]);

  // cursor count per screen
  const cursorMax = useCallback((s)=>{
    if(s==='home') return MENU.length;
    if(s==='projects') return 4;
    if(s==='contact') return 3;
    return 1;
  },[]);

  // navigation helpers
  const goTo = useCallback((target)=>{
    setStack(s=>[...s, screen]);
    setScreen(target);
    setCursor(0);
    sfx.chime();
  },[screen, sfx]);

  const goBack = useCallback(()=>{
    setStack(s=>{
      if(s.length===0){ sfx.error(); return s; }
      const prev = s[s.length-1];
      setScreen(prev);
      setCursor(0);
      sfx.back();
      return s.slice(0,-1);
    });
  },[sfx]);

  const moveCursor = useCallback((delta)=>{
    if(screen==='about' || screen==='resume'){
      // scroll instead
      setScrollMap(m=>({...m, [screen]: Math.max(0, (m[screen]||0) + delta*16)}));
      sfx.blip();
      return;
    }
    setCursor(c=>{
      const max = cursorMax(screen);
      const n = (c + delta + max) % max;
      sfx.blip();
      return n;
    });
  },[screen, cursorMax, sfx]);

  const pressA = useCallback(()=>{
    if(screen==='home'){
      const target = MENU[cursor].id;
      goTo(target);
    } else if(screen==='resume'){
      // trigger download
      const a = document.getElementById('resume-download');
      if(a){
        sfx.confirm();
        setDownloadBlink(true);
        setTimeout(()=>setDownloadBlink(false), 220);
        a.click();
      }
    } else if(screen==='contact'){
      const items = [
        'https://github.com/Ctrl-Zee',
        'https://www.linkedin.com/in/andrew-smith-aa763164/',
        'mailto:andrew.smith.indy@gmail.com',
      ];
      sfx.confirm();
      window.open(items[cursor], '_blank', 'noopener,noreferrer');
    } else if(screen==='secret'){
      setSecret(false);
      setScreen('home');
      sfx.back();
    } else {
      sfx.confirm();
    }
  },[screen, cursor, goTo, sfx]);

  const pressB = useCallback(()=>{
    if(screen==='home'){ sfx.error(); return; }
    if(screen==='secret'){ setSecret(false); setScreen('home'); setStack([]); sfx.back(); return; }
    goBack();
  },[screen, goBack, sfx]);

  // konami detection
  const checkKonami = useCallback((key)=>{
    const buf = konamiBuf.current;
    buf.push(key);
    if(buf.length > KONAMI.length) buf.shift();
    if(buf.length === KONAMI.length && buf.every((k,i)=>k.toLowerCase()===KONAMI[i].toLowerCase())){
      konamiBuf.current = [];
      setKonamiOn(true);
      setConfetti(true);
      setSecret(true);
      sfx.konami();
      setTimeout(()=>setConfetti(false), 3200);
    }
  },[sfx]);

  // visual press feedback
  const flash = useCallback((id)=>{
    setPressed(p=>({...p, [id]:true}));
    setTimeout(()=>setPressed(p=>({...p, [id]:false})), 110);
  },[]);

  // synthetic button handlers (used by both keyboard + on-screen taps)
  const handle = useCallback((btn)=>{
    ensure();
    flash(btn);
    if(btn==='up')    { moveCursor(-1); checkKonami('ArrowUp'); }
    else if(btn==='down') { moveCursor( 1); checkKonami('ArrowDown'); }
    else if(btn==='left') { checkKonami('ArrowLeft');  if(screen==='projects'||screen==='contact'){ moveCursor(-1);} else { sfx.blip(); } }
    else if(btn==='right'){ checkKonami('ArrowRight'); if(screen==='projects'||screen==='contact'){ moveCursor( 1);} else { sfx.blip(); } }
    else if(btn==='a')    { checkKonami('a'); pressA(); }
    else if(btn==='b')    { checkKonami('b'); pressB(); }
    else if(btn==='start'){ sfx.confirm(); if(screen!=='home'){ setScreen('home'); setStack([]); setCursor(0);} }
    else if(btn==='select'){ sfx.blip(); setMuted(m=>!m); }
  },[moveCursor, pressA, pressB, sfx, ensure, flash, checkKonami, screen, setMuted]);

  // keyboard listeners
  useEffect(()=>{
    const onKey = (e)=>{
      const k = e.key;
      const map = {
        'ArrowUp':'up','ArrowDown':'down','ArrowLeft':'left','ArrowRight':'right',
        'z':'a','Z':'a','Enter':'a',
        'x':'b','X':'b','Backspace':'b',
        'Enter ':'a',
      };
      let btn = map[k];
      if(!btn){
        if(k==='a' || k==='A') btn='a';
        if(k==='b' || k==='B') btn='b';
      }
      if(btn){ e.preventDefault(); handle(btn); }
    };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  },[handle]);

  // ambient
  useEffect(()=>{
    const id = setInterval(()=>setBootTick(t=>t+1), 1000);
    return ()=>clearInterval(id);
  },[]);

  // render the active screen content
  const renderLCD = ()=>{
    if(orientation==='landscape'){
      return <RotateScreen palette={palette}/>;
    }
    if(secret){
      return (
        <div className="absolute inset-0 flex flex-col items-center justify-center" style={{padding:14, textAlign:'center'}}>
          <div className="pixel" style={{fontSize:10, color:palette.ink, letterSpacing:1, marginBottom:8}}>!! SECRET !!</div>
          <div className="pixel" style={{fontSize:8, color:palette.hi, letterSpacing:1, lineHeight:1.7}}>
            YOU FOUND<br/>THE CHEAT CODE.<br/><br/>+30 LIVES
          </div>
          <div className="pixel" style={{fontSize:6, color:palette.mid, marginTop:14, letterSpacing:1}}>Ⓐ OR Ⓑ TO RETURN</div>
        </div>
      );
    }
    switch(screen){
      case 'home':     return <HomeScreen     cursor={cursor} palette={palette} />;
      case 'about':    return <AboutScreen    palette={palette} scrollY={scrollMap.about} />;
      case 'projects': return <ProjectsScreen cursor={cursor} palette={palette} scrollY={scrollMap.projects} />;
      case 'resume':   return <ResumeScreen   palette={palette} scrollY={scrollMap.resume} downloadBlink={downloadBlink}/>;
      case 'contact':  return <ContactScreen  cursor={cursor} palette={palette} />;
      default:         return null;
    }
  };

  // ---- Layout ----
  // We render an SVG-ish chassis using flex/CSS. Single device that scales via container query.
  return (
    <div className="noselect" style={{minHeight:'100dvh', display:'flex', alignItems:'center', justifyContent:'center', position:'relative', zIndex:1, padding:'12px 16px'}}>
      <Device
        renderLCD={renderLCD}
        handle={handle}
        pressed={pressed}
        muted={muted}
        confetti={confetti}
        konamiOn={konamiOn}
        palette={palette}
      />
      <Footer/>
    </div>
  );
}

      <span className="pixel" style={{fontSize:8, color:'rgba(255,255,255,.95)', letterSpacing:2, background:'rgba(20,10,40,.55)', padding:'4px 10px', borderRadius:4}}>

}

function DPad({ handle, pressed }){
  const arm = (dir, style)=>(
    <button
      aria-label={dir}
      onMouseDown={()=>handle(dir)}
      onTouchStart={(e)=>{ e.preventDefault(); handle(dir); }}
      className={`dpad-arm ${pressed[dir]?'pressed':''}`}
      style={{
        position:'absolute', border:'none', cursor:'pointer',
        ...style,
      }}
    />
  );
  return (
    <div style={{position:'relative', width:'clamp(80px, 26%, 110px)', aspectRatio:'1/1', flexShrink:0}}>
      <div className="dpad-base" style={{position:'absolute', inset:0, borderRadius:'12px', clipPath:'polygon(34% 0, 66% 0, 66% 34%, 100% 34%, 100% 66%, 66% 66%, 66% 100%, 34% 100%, 34% 66%, 0 66%, 0 34%, 34% 34%)'}}/>
      {arm('up',    {top:0, left:'34%', width:'32%', height:'34%', borderRadius:'8px 8px 0 0'})}
      {arm('down',  {bottom:0, left:'34%', width:'32%', height:'34%', borderRadius:'0 0 8px 8px'})}
      {arm('left',  {top:'34%', left:0, width:'34%', height:'32%', borderRadius:'8px 0 0 8px'})}
      {arm('right', {top:'34%', right:0, width:'34%', height:'32%', borderRadius:'0 8px 8px 0'})}
      {/* center cap */}
      <div style={{position:'absolute', top:'34%', left:'34%', width:'32%', height:'32%', background:'#0e0818', boxShadow:'inset 0 0 4px rgba(0,0,0,.6)'}}/>
    </div>
  );
}

function ABButtons({ handle, pressed }){
  return (
    <div style={{
      display:'flex', alignItems:'center', gap:14,
      transform:'rotate(-18deg)',
      justifyContent:'flex-end', flexShrink:0,
    }}>
      <div style={{textAlign:'center'}}>
        <button
          aria-label="B"
          onMouseDown={()=>handle('b')}
          onTouchStart={(e)=>{ e.preventDefault(); handle('b'); }}
          className={`ab-btn ${pressed['b']?'pressed':''}`}
          style={{width:48, height:48, borderRadius:'50%', border:'none', cursor:'pointer'}}
        />
        <div className="pixel engraved" style={{fontSize:8, marginTop:6, transform:'rotate(18deg)'}}>B</div>
      </div>
      <div style={{textAlign:'center'}}>
        <button
          aria-label="A"
          onMouseDown={()=>handle('a')}
          onTouchStart={(e)=>{ e.preventDefault(); handle('a'); }}
          className={`ab-btn ${pressed['a']?'pressed':''}`}
          style={{width:48, height:48, borderRadius:'50%', border:'none', cursor:'pointer'}}
        />
        <div className="pixel engraved" style={{fontSize:8, marginTop:6, transform:'rotate(18deg)'}}>A</div>
      </div>
    </div>
  );
}

function PillButton({ label, onPress, pressed }){
  return (
    <div style={{textAlign:'center', transform:'rotate(-18deg)'}}>
      <button
        onMouseDown={onPress}
        onTouchStart={(e)=>{ e.preventDefault(); onPress(); }}
        className={`pill ${pressed?'pressed':''}`}
        style={{
          width:54, height:14, borderRadius:8, border:'none', cursor:'pointer',
        }}
      />
      <div className="pixel engraved" style={{fontSize:7, letterSpacing:1.5, marginTop:6}}>{label}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
